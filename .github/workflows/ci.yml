name: CI

on:
  push:
  pull_request:

jobs:
  linux-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure headless build
        run: >-
          cmake -S . -B build-ci
          -DBUILD_LAUNCHER=OFF
          -DBUILD_TESTING=ON
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - name: Build
        run: cmake --build build-ci --parallel 2
      - name: Test
        run: ctest --test-dir build-ci --output-on-failure --timeout 60 -LE local
      - name: Test web frontend
        run: node --experimental-vm-modules --test tests/web_audio.mjs tests/web_launch_config.mjs
