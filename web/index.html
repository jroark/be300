<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BE-300 Emulator</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css?v=20260511a">
</head>
<body>
  <main class="shell">
    <section class="panel controls">
      <h1>BE-300 Emulator</h1>
      <p class="field-hint">
        Cold-boots BE-300 NAND images with NE2000, Stowaway keyboard, and
        host-time RTC enabled. The worker writes the selected image into
        MEMFS before calling <code>be300_create()</code>.
      </p>
      <div class="actions">
        <button id="bootBtn" disabled>Boot</button>
        <button id="stopBtn" disabled>Stop</button>
        <button id="resetBtn" disabled>Reset</button>
      </div>
      <label class="field">
        <span>Hosted NAND image</span>
        <select id="nandSelect">
          <option value="300">WinCE 3.0 (300.bin)</option>
          <option value="beshell">BEshell (beshell.bin)</option>
          <option value="expod">Expod (expod.bin)</option>
          <option value="mw">Microwindows (mw.bin)</option>
          <option value="net">Net (net.bin)</option>
          <option value="opie">OPIE Linux (opie.bin, 64 MB SDRAM)</option>
          <option value="picogui">PicoGUI (picogui.bin)</option>
        </select>
      </label>
      <label class="field">
        <span>NAND upload override</span>
        <input id="nandFile" type="file" accept=".bin,application/octet-stream">
        <small class="field-hint">Leave empty to boot the hosted image selected above.</small>
      </label>
      <div class="boot-config-grid">
        <label class="field speed-field">
          <span>Speed</span>
          <input id="speedControl" type="range" min="0" max="64" step="1" value="0">
          <output id="speedValue" for="speedControl">Full speed</output>
        </label>
        <label class="field">
          <span>Primary PCMCIA socket</span>
          <select id="primarySocket">
            <option value="none">No card</option>
            <option value="cf0">CompactFlash slot 0</option>
            <option value="ne2000" selected>NE2000 Ethernet</option>
          </select>
          <input id="cf0File" type="file" accept=".img,.bin,application/octet-stream" hidden>
        </label>
        <label class="field">
          <span>CF slot 1</span>
          <input id="cf1File" type="file" accept=".img,.bin,application/octet-stream">
        </label>
        <label class="field">
          <span>NE2000 MAC</span>
          <input id="netMac" type="text" inputmode="text" placeholder="10:20:30:00:00:10">
        </label>
        <label class="field">
          <span>Bridge URL (optional)</span>
          <input id="netBridgeUrl" type="text" inputmode="url" value="ws://127.0.0.1:8765">
          <small class="field-hint">Run the local bridge helper first, then boot with this URL.</small>
          <div class="download-links" aria-label="Network bridge downloads">
            <a class="field-link" href="./downloads/be300-net-bridge-macos-arm64.tar.gz" download>macOS Apple Silicon</a>
            <a class="field-link" href="./downloads/be300-net-bridge-macos-amd64.tar.gz" download>macOS Intel</a>
            <a class="field-link" href="./downloads/be300-net-bridge-windows-amd64.zip" download>Windows</a>
            <a class="field-link" href="./downloads/be300-net-bridge-linux-amd64.tar.gz" download>Linux</a>
          </div>
        </label>
        <label class="checkbox-field checkbox-row">
          <input id="targusKeyboardEnabled" type="checkbox" checked>
          <span>Targus / Stowaway keyboard</span>
        </label>
      </div>
      <p id="status" class="status">Ready to boot hosted NAND image.</p>
    </section>

    <section class="panel screen-panel">
      <div class="screen-wrap">
        <div class="device-frame">
          <div class="screen-viewport">
            <canvas id="screen" width="240" height="320"></canvas>
          </div>
          <img class="device-frame-overlay" src="./be300_frame.png" alt="" aria-hidden="true">
        </div>
      </div>
      <div class="controls-grid">
        <div class="dpad">
          <button data-set="btn1" data-mask="16">Up</button>
          <button data-set="btn1" data-mask="128">Left</button>
          <button data-set="btn1" data-mask="64">Right</button>
          <button data-set="btn1" data-mask="32">Down</button>
        </div>
        <div class="action-buttons">
          <button data-set="btn1" data-mask="4">OK</button>
          <button data-set="btn1" data-mask="8">Esc</button>
          <button data-set="btn2" data-mask="16" data-toggle="true" aria-pressed="false">Rocket</button>
        </div>
      </div>
    </section>

    <section class="panel serial-panel">
      <div class="serial-header">
        <h2>Serial Output</h2>
        <div class="serial-actions">
          <button id="toggleSerialBtn" type="button" aria-controls="serial" aria-expanded="true">Collapse</button>
          <button id="clearSerialBtn" type="button">Clear</button>
        </div>
      </div>
      <pre id="serial"></pre>
    </section>
  </main>

  <script type="module" src="./app.js?v=20260511a"></script>
</body>
</html>
